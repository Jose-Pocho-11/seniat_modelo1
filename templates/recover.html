<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seniat Control - Recuperar Contraseña</title>
    
    <!-- LIBRERÍAS LOCALES -->
    <script src="{{ url_for('static', filename='js/tailwindcss.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inter-font.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bg-login-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
            position: relative;
            overflow: hidden;
        }
        .bg-login-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: pulse-bg 15s infinite linear;
        }
        @keyframes pulse-bg {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
    </style>
</head>
<body class="bg-login-gradient min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl relative z-10 animate-in fade-in zoom-in duration-500">
        
        <!-- HEADER / LOGO -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-xl mb-4 transform transition hover:scale-105 hover:rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
            </div>
            <h1 class="font-extrabold text-3xl tracking-tighter text-slate-800">Recuperar <span class="text-blue-600">Acceso</span></h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2 text-center">Ingresa tu correo o cédula para continuar</p>
        </div>

        <!-- FORMULARIO -->
        <form id="recoverForm" class="space-y-6">
            
            <div id="alertBox" class="hidden px-4 py-3 rounded relative text-sm font-bold" role="alert">
                <span id="alertMessage"></span>
            </div>

            <!-- IDENTIFICACIÓN -->
            <div class="space-y-2 relative group">
                <label for="identificacion" class="text-xs font-bold text-slate-600 uppercase tracking-wider ml-1">Cédula o Correo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <input type="text" id="identificacion" name="identificacion" placeholder="Ej. 12345678 o correo@ejemplo.com" required
                        class="w-full bg-white/50 border border-slate-200 rounded-2xl py-3 pl-12 pr-4 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm">
                </div>
            </div>

            <!-- BOTONES -->
            <div class="pt-2 space-y-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-1 transition-all">
                    Continuar
                </button>
                
                <a href="/login" class="w-full block text-center bg-white hover:bg-slate-50 text-blue-600 border-2 border-blue-100 hover:border-blue-200 font-bold py-3.5 px-6 rounded-2xl shadow-sm transition-all">
                    Volver al Inicio de Sesión
                </a>
            </div>

        </form>
    </div>

    <script>
        document.getElementById('recoverForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = 'Buscando...';
            
            try {
                const res = await fetch('/api/recover/identify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (res.ok) {
                    sessionStorage.setItem('sec_q1', result.preguntas[0]);
                    sessionStorage.setItem('sec_q2', result.preguntas[1]);
                    window.location.href = '/recover_step2';
                } else {
                    const alertBox = document.getElementById('alertBox');
                    alertBox.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                    document.getElementById('alertMessage').innerText = result.error || 'Error al buscar usuario';
                    btn.disabled = false;
                    btn.innerText = 'Continuar';
                }
            } catch (err) {
                const alertBox = document.getElementById('alertBox');
                alertBox.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                document.getElementById('alertMessage').innerText = 'Error de conexión';
                btn.disabled = false;
                btn.innerText = 'Continuar';
            }
        });
    </script>
</body>
</html>
