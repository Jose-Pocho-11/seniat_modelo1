<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seniat Control - Preguntas de Seguridad</title>
    
    <!-- LIBRERÍAS LOCALES -->
    <script src="{{ url_for('static', filename='js/tailwindcss.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inter-font.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .bg-login-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%);
            position: relative;
            overflow: hidden;
        }
        .bg-login-gradient::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: pulse-bg 15s infinite linear;
        }
        @keyframes pulse-bg {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
    </style>
</head>
<body class="bg-login-gradient min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-md rounded-[2rem] p-8 shadow-2xl relative z-10 animate-in fade-in zoom-in duration-500" style="zoom: 0.9;">
        
        <!-- HEADER / LOGO -->
        <div class="flex flex-col items-center mb-6">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-xl mb-3 transform transition hover:scale-105 hover:rotate-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
            </div>
            <h1 class="font-extrabold text-3xl tracking-tighter text-slate-800">Seguridad</h1>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 text-center">Responde y crea una nueva contraseña</p>
        </div>

        <!-- FORMULARIO DE VERIFICACIÓN -->
        <form id="verifyForm" class="space-y-4">
            
            <div id="alertBox" class="hidden px-4 py-3 rounded relative text-sm font-bold" role="alert">
                <span id="alertMessage"></span>
            </div>

            <!-- PREGUNTA 1 -->
            <div class="space-y-2 group">
                <label id="lbl_q1" class="text-xs font-bold text-slate-500 italic block mb-1">Pregunta 1: Cargando...</label>
                <div class="relative">
                    <input type="text" id="respuesta_1" name="respuesta_1" placeholder="Tu respuesta a la primera pregunta" required
                        class="w-full bg-white/50 border border-slate-200 rounded-2xl py-3 px-4 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm">
                </div>
            </div>

            <!-- PREGUNTA 2 -->
            <div class="space-y-2 group">
                <label id="lbl_q2" class="text-xs font-bold text-slate-500 italic block mb-1">Pregunta 2: Cargando...</label>
                <div class="relative">
                    <input type="text" id="respuesta_2" name="respuesta_2" placeholder="Tu respuesta a la segunda pregunta" required
                        class="w-full bg-white/50 border border-slate-200 rounded-2xl py-3 px-4 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm">
                </div>
            </div>

            <!-- BOTONES -->
            <div class="pt-2 space-y-4">
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-blue-500/30 transform hover:-translate-y-1 transition-all">
                    Verificar Respuestas
                </button>
                <a href="/recover" class="w-full block text-center bg-transparent text-slate-400 hover:text-blue-600 font-bold py-2 text-sm transition-colors">
                    Volver
                </a>
            </div>
        </form>

        <!-- FORMULARIO DE NUEVA CONTRASEÑA (Oculto inicialmente) -->
        <form id="resetForm" class="space-y-4 hidden mt-4">
            
            <div id="resetAlertBox" class="hidden px-4 py-3 rounded relative text-sm font-bold" role="alert">
                <span id="resetAlertMessage"></span>
            </div>

            <hr class="border-slate-200 my-2">
            <p class="text-sm font-bold text-green-600 text-center mb-4">Identidad verificada. Por favor establece tu nueva contraseña.</p>

            <!-- NUEVA CONTRASEÑA -->
            <div class="space-y-2 group">
                <label for="nueva_contrasena" class="text-xs font-bold text-slate-600 uppercase tracking-wider ml-1">Nueva Contraseña</label>
                <input type="password" id="nueva_contrasena" name="nueva_contrasena" placeholder="••••••••" required
                    class="w-full bg-white/50 border border-slate-200 rounded-2xl py-3 px-4 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm">
            </div>

            <!-- CONFIRMAR CONTRASEÑA -->
            <div class="space-y-2 group">
                <label for="confirmar_contrasena" class="text-xs font-bold text-slate-600 uppercase tracking-wider ml-1">Confirmar Contraseña</label>
                <input type="password" id="confirmar_contrasena" name="confirmar_contrasena" placeholder="••••••••" required
                    class="w-full bg-white/50 border border-slate-200 rounded-2xl py-3 px-4 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all shadow-sm">
            </div>

            <!-- BOTONES -->
            <div class="pt-2 space-y-4">
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg hover:shadow-green-500/30 transform hover:-translate-y-1 transition-all">
                    Guardar Nueva Contraseña
                </button>
            </div>
        </form>
    </div>

    <script>
        // Cargar preguntas de seguridad desde sessionStorage
        document.addEventListener('DOMContentLoaded', () => {
            const q1 = sessionStorage.getItem('sec_q1');
            const q2 = sessionStorage.getItem('sec_q2');
            
            if (!q1 || !q2) {
                window.location.href = '/recover';
            } else {
                document.getElementById('lbl_q1').innerText = `Pregunta 1: ${q1}`;
                document.getElementById('lbl_q2').innerText = `Pregunta 2: ${q2}`;
            }
        });

        // Verificación
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = 'Verificando...';
            
            try {
                const res = await fetch('/api/recover/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (res.ok) {
                    document.getElementById('verifyForm').classList.add('hidden');
                    document.getElementById('resetForm').classList.remove('hidden');
                } else {
                    const alertBox = document.getElementById('alertBox');
                    alertBox.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                    document.getElementById('alertMessage').innerText = result.error || 'Respuestas incorrectas';
                    btn.disabled = false;
                    btn.innerText = 'Verificar Respuestas';
                }
            } catch (err) {
                const alertBox = document.getElementById('alertBox');
                alertBox.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                document.getElementById('alertMessage').innerText = 'Error de conexión';
                btn.disabled = false;
                btn.innerText = 'Verificar Respuestas';
            }
        });

        // Cambio de Contraseña
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nueva = document.getElementById('nueva_contrasena').value;
            const confirmar = document.getElementById('confirmar_contrasena').value;
            
            const alertBox = document.getElementById('resetAlertBox');
            const alertMsg = document.getElementById('resetAlertMessage');
            const btn = e.target.querySelector('button[type="submit"]');
            
            if (nueva !== confirmar) {
                alertBox.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                alertMsg.innerText = 'Las contraseñas no coinciden';
                return;
            }
            
            btn.disabled = true;
            btn.innerText = 'Guardando...';
            
            try {
                const res = await fetch('/api/recover/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contrasena: nueva })
                });
                const result = await res.json();
                
                if (res.ok) {
                    sessionStorage.removeItem('sec_q1');
                    sessionStorage.removeItem('sec_q2');
                    alertBox.className = 'bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                    alertMsg.innerText = 'Contraseña actualizada. Redirigiendo al login...';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    alertBox.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                    alertMsg.innerText = result.error || 'Error al cambiar contraseña';
                    btn.disabled = false;
                    btn.innerText = 'Guardar Nueva Contraseña';
                }
            } catch (err) {
                alertBox.className = 'bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative text-sm font-bold block mb-4';
                alertMsg.innerText = 'Error de conexión';
                btn.disabled = false;
                btn.innerText = 'Guardar Nueva Contraseña';
            }
        });
    </script>
</body>
</html>
